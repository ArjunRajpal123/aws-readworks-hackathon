server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pipeline output, synced from s3://<media bucket>/sa/ by the pod's sidecar.
    # Timing files are gzip bytes; the player gunzips them itself when the
    # response has no Content-Encoding header.
    location /sa/ {
        root /data;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
